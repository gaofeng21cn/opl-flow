[project]
name = "opl-flow"
version = "0.1.98"
description = "OPL Flow local-first workflow profile, event controller, and fleet runtime"
requires-python = ">=3.12"
dependencies = [
  "filelock>=3.16.0",
  "pydantic>=2.10.0",
  "python-frontmatter>=1.1.0",
  "tenacity>=9.0.0",
  "typer>=0.15.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
